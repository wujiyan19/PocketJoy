<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">玩趣盒 · LittleGames</title>
  <desc id="desc">蓝青色玩具盒、棋盘与彩色方块组成的品牌插画。把零碎时间，留给一点好玩。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F8FB"/>
      <stop offset="1" stop-color="#EBF4F5"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#3C8FCA"/>
      <stop offset="1" stop-color="#17659D"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9FE4DF"/>
      <stop offset="1" stop-color="#64C4C4"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0.6" y2="1">
      <stop stop-color="#FFB69F"/>
      <stop offset="1" stop-color="#EE8C74"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#153D57" flood-opacity="0.13"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#153D57" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94B6C5" opacity="0.25"/>
    </pattern>
  </defs>

