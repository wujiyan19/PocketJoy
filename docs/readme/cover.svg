    <text x="118" y="309" fill="#496A7D" font-size="12" font-weight="600" letter-spacing="2.6">NATIVE. LOCAL. PLAYFUL.</text>
    <text x="66" y="390" fill="#78909D" font-size="12" letter-spacing="1.5">A LITTLE BOX OF PLAY / HARMONYOS</text>
